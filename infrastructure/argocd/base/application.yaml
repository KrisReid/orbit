# =============================================================================
# Orbit ArgoCD Application - Base
# =============================================================================
# This defines the base ArgoCD Application for deploying Orbit via GitOps.
#
# IMPORTANT: Do not apply this file directly. Use the overlays instead:
#   - Production: kustomize build argocd/overlays/production | kubectl apply -f -
#   - Staging:    kustomize build argocd/overlays/staging | kubectl apply -f -
#
# Prerequisites:
#   - ArgoCD installed in the cluster
#   - External Secrets Operator installed (for cloud deployments)
#   - ClusterSecretStore configured (created by Terraform gitops module)
#   - ExternalSecret created (created by Terraform gitops module)
# =============================================================================

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: orbit
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    # UPDATE THIS: Your forked/cloned repository URL
    repoURL: https://github.com/YOUR_ORG/orbit.git
    targetRevision: HEAD
    path: infrastructure/helm/orbit

    helm:
      releaseName: orbit
      valueFiles:
        - values.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: orbit

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - PruneLast=true
      - ApplyOutOfSyncOnly=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m

  revisionHistoryLimit: 10
