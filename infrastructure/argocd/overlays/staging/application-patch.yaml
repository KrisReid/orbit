# =============================================================================
# Orbit ArgoCD Application - Staging Overlay
# =============================================================================
# Staging-specific configuration for Orbit deployment.
#
# Usage:
#   kustomize build infrastructure/argocd/overlays/staging | kubectl apply -f -
#
# Configuration checklist:
#   [ ] Update source.repoURL to your repository
#   [ ] Update ingress.host to your staging domain
#   [ ] Update image repositories to your container registry
#   [ ] Ensure ExternalSecret "orbit-db-credentials" exists (created by Terraform)
# =============================================================================

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: orbit-staging
  namespace: argocd
spec:
  source:
    # UPDATE THIS: Your Git repository URL
    repoURL: https://github.com/YOUR_ORG/orbit.git
    targetRevision: develop  # Staging branch

    helm:
      valueFiles:
        - values.yaml

      # Staging-specific values
      values: |
        # =============================================================================
        # Staging Environment Values
        # =============================================================================
        
        backend:
          replicaCount: 1
          
          image:
            # UPDATE THIS: Your container registry
            repository: ghcr.io/YOUR_ORG/orbit-backend
            tag: latest
            pullPolicy: Always  # Always pull latest for staging
          
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"

          autoscaling:
            enabled: false

          env:
            DEBUG: "true"

        frontend:
          replicaCount: 1
          
          image:
            # UPDATE THIS: Your container registry
            repository: ghcr.io/YOUR_ORG/orbit-frontend
            tag: latest
            pullPolicy: Always

          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "200m"

          autoscaling:
            enabled: false

        ingress:
          enabled: true
          className: nginx
          # UPDATE THIS: Your staging domain
          host: staging.orbit.example.com
          
          annotations:
            cert-manager.io/cluster-issuer: letsencrypt-staging
            nginx.ingress.kubernetes.io/ssl-redirect: "true"
          
          tls:
            enabled: true
            secretName: orbit-staging-tls

        # Use external database (RDS/CloudSQL provisioned by Terraform)
        postgresql:
          enabled: false

        externalDatabase:
          enabled: true
          existingSecret: "orbit-db-credentials"
          existingSecretConnectionStringKey: "DATABASE_URL"

        podDisruptionBudget:
          enabled: false

  destination:
    namespace: orbit-staging
