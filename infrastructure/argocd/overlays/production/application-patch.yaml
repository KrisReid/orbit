# =============================================================================
# Orbit ArgoCD Application - Production Overlay
# =============================================================================
# Production-specific configuration for Orbit deployment.
#
# Usage:
#   kustomize build infrastructure/argocd/overlays/production | kubectl apply -f -
#
# Configuration checklist:
#   [ ] Update source.repoURL to your repository
#   [ ] Update ingress.host to your production domain
#   [ ] Update image repositories to your container registry
#   [ ] Ensure ExternalSecret "orbit-db-credentials" exists (created by Terraform)
# =============================================================================

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: orbit
  namespace: argocd
spec:
  source:
    # UPDATE THIS: Your Git repository URL
    repoURL: https://github.com/YOUR_ORG/orbit.git
    targetRevision: main  # Production branch

    helm:
      valueFiles:
        - values.yaml

      # Production-specific values
      values: |
        # =============================================================================
        # Production Environment Values
        # =============================================================================
        
        backend:
          replicaCount: 2
          
          image:
            # UPDATE THIS: Your container registry
            repository: ghcr.io/YOUR_ORG/orbit-backend
            tag: latest  # Consider using specific versions in production
            pullPolicy: IfNotPresent
          
          resources:
            requests:
              memory: "512Mi"
              cpu: "200m"
            limits:
              memory: "1Gi"
              cpu: "1000m"

          autoscaling:
            enabled: true
            minReplicas: 2
            maxReplicas: 10
            targetCPUUtilizationPercentage: 70
            targetMemoryUtilizationPercentage: 80

          env:
            DEBUG: "false"

        frontend:
          replicaCount: 2
          
          image:
            # UPDATE THIS: Your container registry
            repository: ghcr.io/YOUR_ORG/orbit-frontend
            tag: latest
            pullPolicy: IfNotPresent

          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"

          autoscaling:
            enabled: true
            minReplicas: 2
            maxReplicas: 5
            targetCPUUtilizationPercentage: 70

        ingress:
          enabled: true
          className: nginx
          # UPDATE THIS: Your production domain
          host: orbit.example.com
          
          annotations:
            cert-manager.io/cluster-issuer: letsencrypt-prod
            nginx.ingress.kubernetes.io/ssl-redirect: "true"
          
          tls:
            enabled: true
            secretName: orbit-tls

        # Use external database (RDS/CloudSQL provisioned by Terraform)
        postgresql:
          enabled: false

        externalDatabase:
          enabled: true
          existingSecret: "orbit-db-credentials"
          existingSecretConnectionStringKey: "DATABASE_URL"

        podDisruptionBudget:
          enabled: true
          minAvailable: 1

  destination:
    namespace: orbit
