# Production values for Orbit Helm chart
replicaCount: 2

backend:
  replicas: 2
  image:
    repository: ghcr.io/KrisReid/orbit-backend
    tag: "latest" # AUTO-UPDATED
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilizationPercentage: 80
  resources:
    requests:
      cpu: "200m"
      memory: "256Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"
  pdb:
    enabled: true
    minAvailable: 1

frontend:
  replicas: 2
  image:
    repository: ghcr.io/KrisReid/orbit-frontend
    tag: "latest" # AUTO-UPDATED
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilizationPercentage: 80
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "250m"
      memory: "256Mi"
  pdb:
    enabled: true
    minAvailable: 1

ingress:
  enabled: true
  className: "nginx"
  host: orbit.KrisReid.com  # UPDATE THIS
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
  tls:
    enabled: true
    secretName: orbit-tls

# Disable PostgreSQL dependency, as we are using an external database
postgresql:
  enabled: false

externalDatabase:
  enabled: true
  # secretName should contain the connection string
  # The secret must be created manually from Terraform outputs
  # Example secret structure:
  # apiVersion: v1
  # kind: Secret
  # metadata:
  #   name: orbit-db-secret
  # type: Opaque
  # stringData:
  #   database-url: "postgresql://user:password@host:port/dbname"
  secretName: "orbit-db-secret"
  secretKey: "database-url"
