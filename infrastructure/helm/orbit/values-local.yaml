# =============================================================================
# Local Development Values
# =============================================================================
# Use these values for running Orbit on local Kubernetes (minikube, kind, 
# Docker Desktop, or k3s).
#
# Usage:
#   helm install orbit ./infrastructure/helm/orbit -f infrastructure/helm/orbit/values-local.yaml
#
# Or with Docker Compose for local database:
#   docker-compose up -d db
#   helm install orbit ./infrastructure/helm/orbit -f infrastructure/helm/orbit/values-local.yaml
# =============================================================================

# -----------------------------------------------------------------------------
# Backend Configuration
# -----------------------------------------------------------------------------
backend:
  replicaCount: 1

  image:
    repository: orbit-backend
    pullPolicy: Never  # Use locally built images
    tag: "local"

  # No resource limits for local development
  resources: {}

  env:
    DEBUG: "true"
    TASK_ID_PREFIX: "LOCAL"

  # Faster health checks for local development
  livenessProbe:
    httpGet:
      path: /health
      port: http
    initialDelaySeconds: 10
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 5

  readinessProbe:
    httpGet:
      path: /health
      port: http
    initialDelaySeconds: 5
    periodSeconds: 3
    timeoutSeconds: 2
    failureThreshold: 3

  autoscaling:
    enabled: false

# -----------------------------------------------------------------------------
# Frontend Configuration
# -----------------------------------------------------------------------------
frontend:
  replicaCount: 1

  image:
    repository: orbit-frontend
    pullPolicy: Never
    tag: "local"

  resources: {}

  livenessProbe:
    httpGet:
      path: /health
      port: http
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 5

  readinessProbe:
    httpGet:
      path: /health
      port: http
    initialDelaySeconds: 3
    periodSeconds: 3
    timeoutSeconds: 2
    failureThreshold: 3

  autoscaling:
    enabled: false

# -----------------------------------------------------------------------------
# Ingress Configuration
# -----------------------------------------------------------------------------
ingress:
  enabled: true
  className: nginx
  host: orbit.local  # Add to /etc/hosts: 127.0.0.1 orbit.local

  annotations: {}

  tls:
    enabled: false

  paths:
    frontend: /
    api: /api
    health: /health

# -----------------------------------------------------------------------------
# Database Configuration
# -----------------------------------------------------------------------------
# Option 1: Use built-in PostgreSQL (default)
postgresql:
  enabled: true

  auth:
    username: orbit
    password: "localdevpassword"  # Simple password for local dev
    database: orbit

  primary:
    persistence:
      enabled: true
      size: 1Gi

    resources: {}

# Option 2: Use external database (e.g., Docker Compose PostgreSQL)
# Uncomment below and set postgresql.enabled: false
# externalDatabase:
#   enabled: true
#   host: "host.docker.internal"  # For Docker Desktop
#   # host: "localhost"           # For minikube with port-forward
#   port: 5432
#   database: orbit
#   username: orbit
#   existingSecret: ""
#   existingSecretPasswordKey: "password"

# -----------------------------------------------------------------------------
# Service Account
# -----------------------------------------------------------------------------
serviceAccount:
  create: true
  annotations: {}

# -----------------------------------------------------------------------------
# Disable Production Features
# -----------------------------------------------------------------------------
networkPolicy:
  enabled: false

podDisruptionBudget:
  enabled: false
