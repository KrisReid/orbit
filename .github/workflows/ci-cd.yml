name: CI/CD

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test-backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:13
        env:
          POSTGRES_USER: pytest
          POSTGRES_PASSWORD: password
          POSTGRES_DB: pytest
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install ruff
      - name: Lint with Ruff
        run: |
          cd backend
          ruff check .
      - name: Format check with Ruff
        run: |
          cd backend
          ruff format --check .
      - name: Run tests
        env:
          DATABASE_URL: "postgresql://pytest:password@localhost:5432/pytest"
        run: |
          cd backend
          pytest

  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: |
          cd frontend
          npm ci
      - name: Run checks
        run: |
          cd frontend
          npm run lint
          npm run typecheck
          npm test -- --run
          npm run build

  build-and-push:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    needs: [test-backend, test-frontend]
    permissions:
      packages: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ghcr.io/${{ github.repository }}-backend:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max
      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: ghcr.io/${{ github.repository }}-frontend:${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max

  update-helm-values:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    needs: build-and-push
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Update image tags in values files
        run: |
          SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)
          echo "Updating image tags to $SHORT_SHA"
          
          find infrastructure/helm/orbit -type f -name "values*.yaml" | while read -r file; do
            echo "Processing $file"
            sed -i "s/\(repository: ghcr\.io\/${{ github.repository }}-backend\s*\n\s*tag:\s*\).*/\1\"$SHORT_SHA\" # AUTO-UPDATED/" "$file"
            sed -i "s/\(repository: ghcr\.io\/${{ github.repository }}-frontend\s*\n\s*tag:\s*\).*/\1\"$SHORT_SHA\" # AUTO-UPDATED/" "$file"
          done
      - name: Commit and push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add infrastructure/helm/orbit/values.yaml infrastructure/helm/orbit/values-production.yaml
          git commit -m "ci: update image tags to ${{ github.sha }} [skip ci]" || echo "No changes to commit"
          git push
